<!DOCTYPE html>
<html>
<head>
  <title>STQA Practical 1 - Dynamic Form</title>
  <script>
     function submitForm() {
        var name = document.getElementById("name").value;
        var course = document.getElementById("course").value;
        if (name.trim() === "") {
            document.getElementById("message").innerText = "Please enter your name";
            return;
        }
        document.getElementById("message").innerText = "Form submitted successfully - " + name + " - " + course;
     }
  </script>
</head>
<body>
  <h2>Student Registration Form</h2>
  <label>Name:</label>
  <input type="text" id="name"><br><br>
  <label>Course:</label>
  <select id="course">
     <option value="Computer Science">Computer Science</option>
     <option value="Information Technology">Information Technology</option>
     <option value="Commerce">Commerce</option>
  </select><br><br>
  <label><input type="checkbox" id="agree"> I agree</label><br><br>
  <button id="submit" onclick="submitForm()">Submit</button>
  <p id="message"></p>
</body>
</html>
